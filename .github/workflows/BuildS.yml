name: Build Forge 1.18.2 Mod

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Build Mod JAR
        run: gradle build --no-daemon

      - name: Upload JAR to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monstros-magicos-1.18.2-forge
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-slim.jar
          if-no-files-found: error

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && format('v1.0.{0}', github.run_number) || github.ref_name }}
          name: Release ${{ github.ref_name == 'main' && format('v1.0.{0}', github.run_number) || github.ref_name }}
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          generate_release_notes: true
          
