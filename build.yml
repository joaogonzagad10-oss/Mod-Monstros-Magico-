name: Build All-In-One Forge 1.18.2 Mod

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Generate Forge 1.18.2 project and Monstros Magicos source files
        run: |
          python3 - << 'EOF'
          import os, json, struct, zlib

          os.makedirs("gradle/wrapper", exist_ok=True)
          os.makedirs("src/main/java/com/monstrosmagicos/mod/entity/client", exist_ok=True)
          os.makedirs("src/main/java/com/monstrosmagicos/mod/entity/custom", exist_ok=True)
          os.makedirs("src/main/java/com/monstrosmagicos/mod/event", exist_ok=True)
          os.makedirs("src/main/java/com/monstrosmagicos/mod/item", exist_ok=True)
          os.makedirs("src/main/resources/META-INF", exist_ok=True)
          os.makedirs("src/main/resources/assets/monstrosmagicos/lang", exist_ok=True)
          os.makedirs("src/main/resources/assets/monstrosmagicos/models/item", exist_ok=True)
          os.makedirs("src/main/resources/assets/monstrosmagicos/textures/entity", exist_ok=True)
          os.makedirs("src/main/resources/assets/monstrosmagicos/textures/item", exist_ok=True)
          os.makedirs("src/main/resources/data/monstrosmagicos/forge/biome_modifier", exist_ok=True)

          def write_file(path, content):
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content.strip() + "\n")

          def make_png(width, height, pixel_func):
              raw_data = bytearray()
              for y in range(height):
                  raw_data.append(0)
                  for x in range(width):
                      r, g, b, a = pixel_func(x, y)
                      raw_data.extend([r, g, b, a])
              def chunk(tag, data):
                  return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0)
              idat = zlib.compress(bytes(raw_data))
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", idat) + chunk(b"IEND", b"")

          write_file("settings.gradle", """
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven {
                      name = 'MinecraftForge'
                      url = 'https://maven.minecraftforge.net/'
                  }
              }
          }
          """)

          write_file("gradle.properties", """
          org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          """)

          write_file("gradle/wrapper/gradle-wrapper.properties", """
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-7.6.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          """)

          write_file("build.gradle", """
          plugins {
              id 'eclipse'
              id 'maven-publish'
              id 'net.minecraftforge.gradle' version '5.1.+'
          }

          version = '1.0.0'
          group = 'com.monstrosmagicos.mod'
          archivesBaseName = 'monstrosmagicos-1.18.2'

          java.toolchain.languageVersion = JavaLanguageVersion.of(17)

          minecraft {
              mappings channel: 'official', version: '1.18.2'

              runs {
                  client {
                      workingDirectory project.file('run')
                      property 'forge.logging.markers', 'REGISTRIES'
                      property 'forge.logging.console.level', 'debug'
                      mods {
                          monstrosmagicos {
                              source sourceSets.main
                          }
                      }
                  }

                  server {
                      workingDirectory project.file('run')
                      property 'forge.logging.markers', 'REGISTRIES'
                      property 'forge.logging.console.level', 'debug'
                      mods {
                          monstrosmagicos {
                              source sourceSets.main
                          }
                      }
                  }
              }
          }

          dependencies {
              minecraft 'net.minecraftforge:forge:1.18.2-40.2.21'
          }

          jar {
              manifest {
                  attributes([
                          "Specification-Title"     : "monstrosmagicos",
                          "Specification-Vendor"    : "MonstrosMagicos",
                          "Specification-Version"   : "1",
                          "Implementation-Title"    : project.name,
                          "Implementation-Version"  : project.jar.archiveVersion,
                          "Implementation-Vendor"   : "MonstrosMagicos",
                          "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
                  ])
              }
          }

          jar.finalizedBy('reobfJar')
          """)

          write_file("src/main/resources/META-INF/mods.toml", """
          modLoader="javafml"
          loaderVersion="[40,)"
          license="MIT"

          [[mods]]
          modId="monstrosmagicos"
          version="1.0.0"
          displayName="Monstros Magicos"
          description='''
          Adiciona o Monstro de Luz, o Monstro Geleia e o Boss Magico de 3 Rounds!
          '''

          [[dependencies.monstrosmagicos]]
              modId="forge"
              mandatory=true
              versionRange="[40,)"
              ordering="NONE"
              side="BOTH"

          [[dependencies.monstrosmagicos]]
              modId="minecraft"
              mandatory=true
              versionRange="[1.18.2,1.19)"
              ordering="NONE"
              side="BOTH"
          """)

          write_file("src/main/resources/pack.mcmeta", json.dumps({"pack": {"description": "Monstros Magicos Resources", "pack_format": 8}}, indent=2))

          write_file("src/main/java/com/monstrosmagicos/mod/MonstrosMagicosMod.java", """
          package com.monstrosmagicos.mod;

          import com.monstrosmagicos.mod.entity.ModEntities;
          import com.monstrosmagicos.mod.item.ModItems;
          import net.minecraftforge.common.MinecraftForge;
          import net.minecraftforge.eventbus.api.IEventBus;
          import net.minecraftforge.fml.common.Mod;
          import net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext;
          import org.apache.logging.log4j.LogManager;
          import org.apache.logging.log4j.Logger;

          @Mod(MonstrosMagicosMod.MOD_ID)
          public class MonstrosMagicosMod {
              public static final String MOD_ID = "monstrosmagicos";
              public static final Logger LOGGER = LogManager.getLogger();

              public MonstrosMagicosMod() {
                  IEventBus modEventBus = FMLJavaModLoadingContext.get().getModEventBus();
                  ModItems.register(modEventBus);
                  ModEntities.register(modEventBus);
                  MinecraftForge.EVENT_BUS.register(this);
              }
          }
          """)

          write_file("src/main/java/com/monstrosmagicos/mod/item/VarinhaMagicoItem.java", """
          package com.monstrosmagicos.mod.item;

          import net.minecraft.core.particles.ParticleTypes;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.sounds.SoundSource;
          import net.minecraft.world.InteractionHand;
          import net.minecraft.world.InteractionResultHolder;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.LightningBolt;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.level.ClipContext;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.phys.BlockHitResult;
          import net.minecraft.world.phys.HitResult;

          public class VarinhaMagicoItem extends Item {
              public VarinhaMagicoItem(Properties properties) {
                  super(properties);
              }

              @Override
              public InteractionResultHolder<ItemStack> use(Level level, Player player, InteractionHand hand) {
                  ItemStack stack = player.getItemInHand(hand);
                  if (!level.isClientSide && level instanceof ServerLevel serverLevel) {
                      BlockHitResult hit = getPlayerPOVHitResult(level, player, ClipContext.Fluid.NONE);
                      if (hit.getType() != HitResult.Type.MISS) {
                          LightningBolt bolt = EntityType.LIGHTNING_BOLT.create(serverLevel);
                          if (bolt != null) {
                              bolt.moveTo(hit.getLocation().x, hit.getLocation().y, hit.getLocation().z);
                              serverLevel.addFreshEntity(bolt);
                          }
                          serverLevel.sendParticles(ParticleTypes.WITCH, player.getX(), player.getY() + 1.0D, player.getZ(),
                                  25, 0.5, 0.5, 0.5, 0.1);
                          level.playSound(null, player.blockPosition(), SoundEvents.EVOKER_CAST_SPELL, SoundSource.PLAYERS, 1.0F, 1.2F);
                          player.getCooldowns().addCooldown(this, 40);
                          stack.hurtAndBreak(1, player, (p) -> p.broadcastBreakEvent(hand));
                      }
                  }
                  return InteractionResultHolder.sidedSuccess(stack, level.isClientSide());
              }
          }
          """)

          write_file("src/main/java/com/monstrosmagicos/mod/item/ModItems.java", """
          package com.monstrosmagicos.mod.item;

          import com.monstrosmagicos.mod.MonstrosMagicosMod;
          import com.monstrosmagicos.mod.entity.ModEntities;
          import net.minecraft.world.item.CreativeModeTab;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.Rarity;
          import net.minecraftforge.common.ForgeSpawnEggItem;
          import net.minecraftforge.eventbus.api.IEventBus;
          import net.minecraftforge.registries.DeferredRegister;
          import net.minecraftforge.registries.ForgeRegistries;
          import net.minecraftforge.registries.RegistryObject;

          public class ModItems {
              public static final DeferredRegister<Item> ITEMS =
                      DeferredRegister.create(ForgeRegistries.ITEMS, MonstrosMagicosMod.MOD_ID);

              public static final RegistryObject<Item> VARINHA_MAGICO = ITEMS.register("varinha_magico",
                      () -> new VarinhaMagicoItem(new Item.Properties()
                              .tab(CreativeModeTab.TAB_COMBAT)
                              .stacksTo(1)
                              .durability(250)
                              .rarity(Rarity.EPIC)));

              public static final RegistryObject<Item> MONSTRO_LUZ_SPAWN_EGG = ITEMS.register("monstro_luz_spawn_egg",
                      () -> new ForgeSpawnEggItem(ModEntities.MONSTRO_LUZ, 0xFFF39C, 0xD4AC0D,
                              new Item.Properties().tab(CreativeModeTab.TAB_MISC)));

              public static final RegistryObject<Item> MONSTRO_GELEIA_SPAWN_EGG = ITEMS.register("monstro_geleia_spawn_egg",
                      () -> new ForgeSpawnEggItem(ModEntities.MONSTRO_GELEIA, 0x2ECC71, 0x1E8449,
                              new Item.Properties().tab(CreativeModeTab.TAB_MISC)));

              public static final RegistryObject<Item> MAGICO_SPAWN_EGG = ITEMS.register("magico_spawn_egg",
                      () -> new ForgeSpawnEggItem(ModEntities.MAGICO, 0x6C3483, 0xF1C40F,
                              new Item.Properties().tab(CreativeModeTab.TAB_MISC)));

              public static void register(IEventBus eventBus) {
                  ITEMS.register(eventBus);
              }
          }
          """)

          write_file("src/main/java/com/monstrosmagicos/mod/entity/ModEntities.java", """
          package com.monstrosmagicos.mod.entity;

          import com.monstrosmagicos.mod.MonstrosMagicosMod;
          import com.monstrosmagicos.mod.entity.custom.MagicoEntity;
          import com.monstrosmagicos.mod.entity.custom.MonstroGeleiaEntity;
          import com.monstrosmagicos.mod.entity.custom.MonstroLuzEntity;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.MobCategory;
          import net.minecraftforge.eventbus.api.IEventBus;
          import net.minecraftforge.registries.DeferredRegister;
          import net.minecraftforge.registries.ForgeRegistries;
          import net.minecraftforge.registries.RegistryObject;

          public class ModEntities {
              public static final DeferredRegister<EntityType<?>> ENTITY_TYPES =
                      DeferredRegister.create(ForgeRegistries.ENTITIES, MonstrosMagicosMod.MOD_ID);

              public static final RegistryObject<EntityType<MonstroLuzEntity>> MONSTRO_LUZ =
                      ENTITY_TYPES.register("monstro_luz",
                              () -> EntityType.Builder.of(MonstroLuzEntity::new, MobCategory.MONSTER)
                                      .sized(0.6F, 1.95F)
                                      .build(new ResourceLocation(MonstrosMagicosMod.MOD_ID, "monstro_luz").toString()));

              public static final RegistryObject<EntityType<MonstroGeleiaEntity>> MONSTRO_GELEIA =
                      ENTITY_TYPES.register("monstro_geleia",
                              () -> EntityType.Builder.of(MonstroGeleiaEntity::new, MobCategory.MONSTER)
                                      .sized(1.4F, 1.4F)
                                      .build(new ResourceLocation(MonstrosMagicosMod.MOD_ID, "monstro_geleia").toString()));

              public static final RegistryObject<EntityType<MagicoEntity>> MAGICO =
                      ENTITY_TYPES.register("magico",
                              () -> EntityType.Builder.of(MagicoEntity::new, MobCategory.MONSTER)
                                      .sized(0.8F, 2.2F)
                                      .fireImmune()
                                      .build(new ResourceLocation(MonstrosMagicosMod.MOD_ID, "magico").toString()));

              public static void register(IEventBus eventBus) {
                  ENTITY_TYPES.register(eventBus);
