          """)

          write_file("src/main/java/com/monstrosmagicos/mod/entity/custom/MonstroLuzEntity.java", """
          package com.monstrosmagicos.mod.entity.custom;

          import net.minecraft.core.BlockPos;
          import net.minecraft.core.particles.ParticleTypes;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.sounds.SoundEvent;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.world.damagesource.DamageSource;
          import net.minecraft.world.effect.MobEffectInstance;
          import net.minecraft.world.effect.MobEffects;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.ai.attributes.AttributeSupplier;
          import net.minecraft.world.entity.ai.attributes.Attributes;
          import net.minecraft.world.entity.ai.goal.*;
          import net.minecraft.world.entity.ai.goal.target.HurtByTargetGoal;
          import net.minecraft.world.entity.ai.goal.target.NearestAttackableTargetGoal;
          import net.minecraft.world.entity.ai.navigation.GroundPathNavigation;
          import net.minecraft.world.entity.monster.Monster;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.DoorBlock;
          import net.minecraft.world.level.block.state.BlockState;

          import java.util.EnumSet;
          import java.util.HashMap;
          import java.util.Iterator;
          import java.util.Map;
          import java.util.UUID;

          public class MonstroLuzEntity extends Monster {
              private static final Map<UUID, Integer> CURSED_PLAYERS = new HashMap<>();

              public MonstroLuzEntity(EntityType<? extends Monster> type, Level level) {
                  super(type, level);
                  this.xpReward = 15;
                  if (this.getNavigation() instanceof GroundPathNavigation nav) {
                      nav.setCanOpenDoors(true);
                  }
              }

              public static AttributeSupplier.Builder createAttributes() {
                  return Monster.createMonsterAttributes()
                          .add(Attributes.MAX_HEALTH, 36.0D)
                          .add(Attributes.MOVEMENT_SPEED, 0.29D)
                          .add(Attributes.ATTACK_DAMAGE, 4.0D)
                          .add(Attributes.FOLLOW_RANGE, 32.0D)
                          .add(Attributes.ARMOR, 3.0D);
              }

              @Override
              protected void registerGoals() {
                  this.goalSelector.addGoal(0, new FloatGoal(this));
                  this.goalSelector.addGoal(1, new BreakDoorGoal(this, (difficulty) -> true));
                  this.goalSelector.addGoal(2, new MeleeAttackGoal(this, 1.15D, false));
                  this.goalSelector.addGoal(3, new SeekNonTorchLightGoal(this, 1.05D, 18));
                  this.goalSelector.addGoal(4, new WaterAvoidingRandomStrollGoal(this, 0.85D));
                  this.goalSelector.addGoal(5, new LookAtPlayerGoal(this, Player.class, 12.0F));
                  this.goalSelector.addGoal(6, new RandomLookAroundGoal(this));

                  this.targetSelector.addGoal(1, new HurtByTargetGoal(this));
                  this.targetSelector.addGoal(2, new NearestAttackableTargetGoal<>(this, Player.class, true));
              }

              @Override
              public void tick() {
                  super.tick();
                  if (!this.level.isClientSide && this.level instanceof ServerLevel serverLevel) {
                      if (this.tickCount % 5 == 0) {
                          serverLevel.sendParticles(ParticleTypes.END_ROD,
                                  this.getX(), this.getY() + 1.1D, this.getZ(),
                                  2, 0.3, 0.5, 0.3, 0.01);
                      }

                      if (this.tickCount % 15 == 0) {
                          BlockPos pos = this.blockPosition();
                          for (BlockPos check : BlockPos.betweenClosed(pos.offset(-1, 0, -1), pos.offset(1, 2, 1))) {
                              BlockState state = this.level.getBlockState(check);
                              if (state.getBlock() instanceof DoorBlock) {
                                  this.level.destroyBlock(check, true, this);
                                  this.playSound(SoundEvents.ZOMBIE_BREAK_WOODEN_DOOR, 1.0F, 1.0F);
                              }
                          }
                      }

                      if (this.tickCount % 20 == 0 && !CURSED_PLAYERS.isEmpty()) {
                          Iterator<Map.Entry<UUID, Integer>> it = CURSED_PLAYERS.entrySet().iterator();
                          while (it.hasNext()) {
                              Map.Entry<UUID, Integer> entry = it.next();
                              Player target = serverLevel.getPlayerByUUID(entry.getKey());
                              if (target == null || !target.isAlive() || target.isCreative() || target.isSpectator()) {
                                  it.remove();
                                  continue;
                              }
                              if (target.getHealth() > 2.0F) {
                                  float nextHealth = Math.max(2.0F, target.getHealth() - 2.0F);
                                  target.hurt(DamageSource.MAGIC, 0.01F);
                                  target.setHealth(nextHealth);
                                  serverLevel.sendParticles(ParticleTypes.GLOW,
                                          target.getX(), target.getY() + 1.0D, target.getZ(),
                                          8, 0.3, 0.5, 0.3, 0.02);
                              }
                              if (target.getHealth() <= 2.0F || entry.getValue() <= 0) {
                                  it.remove();
                              } else {
                                  entry.setValue(entry.getValue() - 1);
                              }
                          }
                      }
                  }
              }

              @Override
              public boolean doHurtTarget(Entity target) {
                  boolean hit = super.doHurtTarget(target);
                  if (hit && target instanceof LivingEntity living) {
                      living.addEffect(new MobEffectInstance(MobEffects.GLOWING, 160, 0));
                      if (target instanceof Player player && !player.isCreative()) {
                          CURSED_PLAYERS.put(player.getUUID(), 30);
                      }
                  }
                  return hit;
              }

              public static boolean isNonTorchLight(BlockState state) {
                  if (state.getLightEmission() <= 0) return false;
                  if (state.is(Blocks.TORCH) || state.is(Blocks.WALL_TORCH)
                          || state.is(Blocks.SOUL_TORCH) || state.is(Blocks.SOUL_WALL_TORCH)
                          || state.is(Blocks.REDSTONE_TORCH) || state.is(Blocks.REDSTONE_WALL_TORCH)
                          || state.is(Blocks.FIRE) || state.is(Blocks.SOUL_FIRE)
                          || state.is(Blocks.LAVA)) {
                      return false;
                  }
                  return true;
              }

              @Override
              protected SoundEvent getAmbientSound() {
                  return SoundEvents.HUSK_AMBIENT;
              }

              @Override
              protected SoundEvent getHurtSound(DamageSource source) {
                  return SoundEvents.HUSK_HURT;
              }

              @Override
              protected SoundEvent getDeathSound() {
                  return SoundEvents.HUSK_DEATH;
              }

              static class SeekNonTorchLightGoal extends Goal {
                  private final MonstroLuzEntity mob;
                  private final double speed;
                  private final int searchRadius;
                  private BlockPos targetLightPos;

                  public SeekNonTorchLightGoal(MonstroLuzEntity mob, double speed, int searchRadius) {
                      this.mob = mob;
                      this.speed = speed;
                      this.searchRadius = searchRadius;
                      this.setFlags(EnumSet.of(Flag.MOVE));
                  }

                  @Override
                  public boolean canUse() {
                      if (this.mob.getTarget() != null) return false;
                      if (this.mob.tickCount % 25 != 0) return false;
                      BlockPos origin = this.mob.blockPosition();
                      BlockPos closest = null;
                      double bestDist = Double.MAX_VALUE;

                      for (BlockPos pos : BlockPos.betweenClosed(
                              origin.offset(-searchRadius, -4, -searchRadius),
                              origin.offset(searchRadius, 6, searchRadius))) {
                          BlockState state = this.mob.level.getBlockState(pos);
                          if (isNonTorchLight(state)) {
                              double dist = pos.distSqr(origin);
                              if (dist < bestDist) {
                                  bestDist = dist;
                                  closest = pos.immutable();
                              }
                          }
                      }
                      this.targetLightPos = closest;
                      return this.targetLightPos != null;
                  }

                  @Override
                  public void start() {
                      if (this.targetLightPos != null) {
                          this.mob.getNavigation().moveTo(
                                  this.targetLightPos.getX() + 0.5,
                                  this.targetLightPos.getY(),
                                  this.targetLightPos.getZ() + 0.5,
                                  this.speed);
                      }
                  }

                  @Override
                  public boolean canContinueToUse() {
                      return this.targetLightPos != null
                              && this.mob.getTarget() == null
                              && isNonTorchLight(this.mob.level.getBlockState(this.targetLightPos))
                              && this.targetLightPos.distSqr(this.mob.blockPosition()) > 3.0D;
                  }
              }
          }
          """)

          write_file("src/main/java/com/monstrosmagicos/mod/entity/custom/MonstroGeleiaEntity.java", """
          package com.monstrosmagicos.mod.entity.custom;

          import net.minecraft.core.particles.ParticleTypes;
          import net.minecraft.network.chat.TextComponent;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.sounds.SoundEvent;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.world.damagesource.DamageSource;
          import net.minecraft.world.effect.MobEffectInstance;
          import net.minecraft.world.effect.MobEffects;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.ai.attributes.AttributeSupplier;
          import net.minecraft.world.entity.ai.attributes.Attributes;
          import net.minecraft.world.entity.ai.goal.*;
          import net.minecraft.world.entity.ai.goal.target.HurtByTargetGoal;
          import net.minecraft.world.entity.ai.goal.target.NearestAttackableTargetGoal;
          import net.minecraft.world.entity.monster.Monster;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.phys.Vec3;

          import java.util.UUID;

          public class MonstroGeleiaEntity extends Monster {
              private UUID trappedPlayerId = null;
              private int hitsToEscape = 0;
              private int escapeCooldown = 0;

              public MonstroGeleiaEntity(EntityType<? extends Monster> type, Level level) {
                  super(type, level);
                  this.xpReward = 12;
              }

              public static AttributeSupplier.Builder createAttributes() {
                  return Monster.createMonsterAttributes()
                          .add(Attributes.MAX_HEALTH, 40.0D)
                          .add(Attributes.MOVEMENT_SPEED, 0.25D)
                          .add(Attributes.ATTACK_DAMAGE, 3.0D)
                          .add(Attributes.KNOCKBACK_RESISTANCE, 0.7D)
                          .add(Attributes.FOLLOW_RANGE, 24.0D);
              }

              @Override
              protected void registerGoals() {
                  this.goalSelector.addGoal(0, new FloatGoal(this));
                  this.goalSelector.addGoal(1, new MeleeAttackGoal(this, 1.1D, false));
                  this.goalSelector.addGoal(2, new WaterAvoidingRandomStrollGoal(this, 0.8D));
                  this.goalSelector.addGoal(3, new LookAtPlayerGoal(this, Player.class, 10.0F));
                  this.goalSelector.addGoal(4, new RandomLookAroundGoal(this));

                  this.targetSelector.addGoal(1, new HurtByTargetGoal(this));
                  this.targetSelector.addGoal(2, new NearestAttackableTargetGoal<>(this, Player.class, true));
              }

              @Override
              public void tick() {
                  super.tick();
                  if (this.level.isClientSide) return;

                  if (escapeCooldown > 0) {
                      escapeCooldown--;
                  }

                  if (trappedPlayerId != null && this.level instanceof ServerLevel serverLevel) {
                      Player trapped = serverLevel.getPlayerByUUID(trappedPlayerId);
                      if (trapped == null || !trapped.isAlive() || trapped.isCreative() || trapped.isSpectator()) {
                          trappedPlayerId = null;
                          hitsToEscape = 0;
                          return;
                      }

                      trapped.teleportTo(this.getX(), this.getY() + 0.15D, this.getZ());
                      trapped.setDeltaMovement(Vec3.ZERO);
                      trapped.fallDistance = 0.0F;
                      trapped.addEffect(new MobEffectInstance(MobEffects.MOVEMENT_SLOWDOWN, 10, 6, false, false));
                      trapped.addEffect(new MobEffectInstance(MobEffects.BLINDNESS, 25, 0, false, false));

                      if (this.tickCount % 5 == 0) {
                          serverLevel.sendParticles(ParticleTypes.ITEM_SLIME,
                                  this.getX(), this.getY() + 0.8D, this.getZ(),
                                  12, 0.5, 0.5, 0.5, 0.05);
                      }

                      if (this.tickCount % 20 == 0) {
                          trapped.hurt(DamageSource.IN_WALL, 3.0F);
                          trapped.displayClientMessage(
                                  new TextComponent("§aVocê está preso na geleia! Bata nela mais §e" + hitsToEscape + "x §apara sair!"),
                                  true);
                      }
                  } else if (escapeCooldown == 0 && this.tickCount % 4 == 0) {
                      Player nearest = this.level.getNearestPlayer(this, 1.45D);
                      if (nearest != null && !nearest.isCreative() && !nearest.isSpectator()) {
                          this.trappedPlayerId = nearest.getUUID();
                          this.hitsToEscape = 5;
                          this.playSound(SoundEvents.SLIME_ATTACK, 1.3F, 0.7F);
                          nearest.displayClientMessage(
                                  new TextComponent("§2O Monstro Geleia te engoliu! Bata nele 5 vezes para escapar!"),
                                  true);
                      }
                  }
              }

              @Override
              public boolean hurt(DamageSource source, float amount) {
                  boolean result = super.hurt(source, amount);
                  if (!this.level.isClientSide && result && trappedPlayerId != null) {
                      Entity attacker = source.getEntity();
                      if (attacker instanceof Player player && player.getUUID().equals(trappedPlayerId)) {
                          hitsToEscape--;
                          this.playSound(SoundEvents.SLIME_SQUISH, 1.2F, 1.1F);
                          if (hitsToEscape <= 0) {
                              Vec3 look = player.getLookAngle();
                              Vec3 launch = new Vec3(-look.x * 1.4D, 0.65D, -look.z * 1.4D);
                              if (launch.horizontalDistanceSqr() < 0.1D) {
                                  launch = new Vec3(1.2D, 0.65D, 0.0D);
                              }
                              player.setDeltaMovement(launch);
                              player.hurtMarked = true;
                              player.removeEffect(MobEffects.BLINDNESS);
                              player.removeEffect(MobEffects.MOVEMENT_SLOWDOWN);
                              player.displayClientMessage(new TextComponent("§aVocê escapou da geleia!"), true);

                              this.trappedPlayerId = null;
                              this.escapeCooldown = 60;
                              this.playSound(SoundEvents.SLIME_JUMP, 1.5F, 0.6F);
                          } else {
                              player.displayClientMessage(
                                      new TextComponent("§aFaltam §e" + hitsToEscape + " §agolpes para sair!"),
                                      true);
                          }
                      }
                  }
                  return result;
              }

              @Override
              public void die(DamageSource source) {
                  if (!this.level.isClientSide && trappedPlayerId != null && this.level instanceof ServerLevel serverLevel) {
                      Player trapped = serverLevel.getPlayerByUUID(trappedPlayerId);
                      if (trapped != null) {
                          trapped.removeEffect(MobEffects.BLINDNESS);
                          trapped.removeEffect(MobEffects.MOVEMENT_SLOWDOWN);
                      }
                      trappedPlayerId = null;
                  }
                  super.die(source);
              }

              @Override
              protected SoundEvent getAmbientSound() {
                  return SoundEvents.SLIME_SQUISH;
              }

              @Override
              protected SoundEvent getHurtSound(DamageSource source) {
                  return SoundEvents.SLIME_HURT;
              }

              @Override
              protected SoundEvent getDeathSound() {
                  return SoundEvents.SLIME_DEATH;
              }
          }
